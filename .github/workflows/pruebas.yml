name: pruebas

on:
  pull_request:
  push:
    branches: [main, staging]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix dataform
      - run: uv sync --locked
      - run: uv run pytest
